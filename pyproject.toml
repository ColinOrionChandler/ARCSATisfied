[project]
name = "arcsatisfied"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Colin Orion Chandler", email = "orion@nau.edu" }
]
description = "Quick CCD reduction and catalog enrichment for APO ARCSAT FITS data."
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "astropy>=5.3",
    "astroquery>=0.4.6",
    "astroscrappy>=1.1",
    "numpy>=1.23",
    "pandas>=1.5",
]

[project.urls]
"Source Code" = "https://github.com/ColinOrionChandler/ARCSATisfied"

# On a mac, install optional dependencies with `pip install '.[dev]'` (include the single quotes)
[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = [
    "build",
    "twine",
    "pre-commit", # Used to run checks before finalizing a git commit
    "pytest",
    "pytest-cov", # Used to report total code coverage
    "ruff==0.17.0", # Used for static linting of files
]
# Command-line scripts that can be run after installing the package
[project.scripts]
arcsatisfied = "arcsatisfied.cli:main"

[build-system]
requires = [
    "setuptools>=77.0.3", # Used to build and package the Python project
    "setuptools_scm>=8", # Gets release version from git. Makes it available programmatically
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# A source archive without tags cannot recover commit distance. Never label it a release.
fallback_version = "0.1.dev0"
write_to = "src/arcsatisfied/_version.py"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arcsatisfied*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
extend-exclude = ["src/arcsatisfied/_version.py"]
line-length = 110
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pep8-naming
    "N",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # docstrings
    "D101",
    "D102",
    "D103",
    "D106",
    "D206",
    "D207",
    "D208",
    "D300",
    "D417",
    "D419",
    # Numpy v2.0 compatibility
    "NPY201",
]
ignore = [
    "UP006", # Allow non standard library generics in type hints
    "UP007", # Allow Union in type hints
    "SIM114", # Allow if with same arms
    "B028", # Allow default warning level
    "SIM117", # Allow nested with
    "UP015", # Allow redundant open parameters
    "UP028", # Allow yield in for loop
]


[tool.coverage.run]
omit = ["*/arcsatisfied/_version.py"]

[tool.ruff.lint.per-file-ignores]
# Preserve existing control flow and permissive zip behavior during template adoption.
"src/arcsatisfied/catalog.py" = ["SIM105"]
"src/arcsatisfied/horizons.py" = ["B905"]
"tests/**" = ["D101", "D102", "D103", "D106", "D417"]

[tool.coverage.report]
show_missing = true
